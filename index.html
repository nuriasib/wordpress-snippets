<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Snippets</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #0d1117;
  --card: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --blue: #58a6ff;
}

body {
  margin: 0;
  font-family: sans-serif;
  background: var(--bg);
  color: var(--text);
}

.wrap {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
}

h1 {
  margin-bottom: 10px;
}

.topbar {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

input, select {
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: #0d1117;
  color: var(--text);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
}

.card-title {
  color: var(--blue);
  font-weight: 600;
  margin-bottom: 6px;
}

.tag {
  font-size: 11px;
  margin-left: 6px;
  color: var(--muted);
}

iframe {
  width: 100%;
  height: 380px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
}

</style>
</head>

<body>

<div class="wrap">

  <h1>Snippets UI</h1>

  <div class="topbar">
    <input type="text" id="search" placeholder="Buscar...">
    <select id="filter">
      <option value="all">Todos</option>
      <option value="form">Formularios</option>
      <option value="ui">UI</option>
    </select>
  </div>

  <div class="grid" id="grid">

    <!-- SNIPPET -->
    <div class="card" data-name="formulario legal multipaso" data-tag="form">
      <div class="card-title">
        Formulario legal multipaso <span class="tag">form</span>
      </div>
      <iframe src="formulario-legal-multipaso.html"></iframe>
    </div>

    <!-- DUPLICA ESTE BLOQUE PARA MÁS SNIPPETS -->

  </div>

</div>

<script>
const search = document.getElementById("search");
const filter = document.getElementById("filter");
const cards = document.querySelectorAll(".card");

function update() {
  const text = search.value.toLowerCase();
  const tag = filter.value;

  cards.forEach(card => {
    const name = card.dataset.name;
    const ctag = card.dataset.tag;

    const matchText = name.includes(text);
    const matchTag = tag === "all" || tag === ctag;

    card.style.display = (matchText && matchTag) ? "block" : "none";
  });
}

search.addEventListener("input", update);
filter.addEventListener("change", update);
</script>

</body>
</html>
