 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Wordpress Snippets</title>
<style>
  :root {
    --bg: #0d1117;
    --bg-card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --blue: #58a6ff;
    --blue-dark: #1f6feb;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 60px 20px;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
  }
  .logo {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--blue), var(--blue-dark));
    flex-shrink: 0;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0;
    font-weight: 600;
  }
  p.subtitle {
    color: var(--text-muted);
    margin: 6px 0 36px 46px;
    font-size: 0.95rem;
  }
  .grid {
    display: grid;
    gap: 14px;
  }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    transition: border-color 0.15s ease, transform 0.15s ease;
    text-decoration: none;
    display: block;
  }
  .card:hover {
    border-color: var(--blue);
    transform: translateY(-1px);
  }
  .card-title {
    color: var(--blue);
    font-weight: 600;
    font-size: 1.02rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tag {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    background: rgba(88, 166, 255, 0.12);
    color: var(--blue);
    border: 1px solid rgba(88, 166, 255, 0.35);
    border-radius: 5px;
    padding: 2px 8px;
  }
  .card-desc {
    color: var(--text-muted);
    font-size: 0.88rem;
    margin-top: 6px;
  }
  footer {
    margin-top: 48px;
    color: var(--text-muted);
    font-size: 0.8rem;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo"></div>
    <h1>Wordpress Snippets</h1>
  </header>
  <p class="subtitle">Índice de snippets — click para previsualizar cada uno</p>

  <div class="grid">

    <a class="card" href="formulario-legal-multipaso.html">
      <div class="card-title">Formulario legal multipaso <span class="tag">HTML</span></div>
      <div class="card-desc">Formulario con pasos, validación y tarjetas de selección de área legal</div>
    </a>

    <!-- Copia este bloque <a class="card">...</a> por cada snippet nuevo que subas -->

  </div>

  <footer>Repositorio personal · nuriasib</footer>

</div>
</body>
</html>
