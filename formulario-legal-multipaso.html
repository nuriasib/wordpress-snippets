<div class="legal-form-wrapper">
  <form id="legalForm" class="legal-form">

    <input type="text" name="website" class="hp-field" tabindex="-1" autocomplete="off">

    <!-- PASO 1 -->
    <div class="form-step active" data-step="1">
      <div class="progress">
        <span class="active"></span><span></span><span></span>
      </div>

      <p class="step-text">Paso 1 de 3</p>
      <h2>¿En qué área necesitas ayuda?</h2>

      <div class="cards-grid">
        <label class="option-card">
          <input type="radio" name="area" value="Civil" required="">
          <strong>Civil</strong>
          <span>Contratos, herencias, familia...</span>
        </label>

        <label class="option-card">
          <input type="radio" name="area" value="Penal">
          <strong>Penal</strong>
          <span>Defensa, víctimas, juicios...</span>
        </label>

        <label class="option-card">
          <input type="radio" name="area" value="Laboral">
          <strong>Laboral</strong>
          <span>Despidos, salarios, acoso...</span>
        </label>

        <label class="option-card">
          <input type="radio" name="area" value="Administrativo">
          <strong>Administrativo</strong>
          <span>Recursos, multas, licencias...</span>
        </label>

        <label class="option-card">
          <input type="radio" name="area" value="No estoy seguro/a">
          <strong>No estoy seguro/a</strong>
          <span>Cuéntanos y te orientamos</span>
        </label>
      </div>

      <div class="form-footer">
        <span></span>
        <button type="button" class="btn next">Siguiente ›</button>
      </div>
    </div>

    <!-- PASO 2 -->
    <div class="form-step" data-step="2">
      <div class="progress">
        <span class="active"></span><span class="active"></span><span></span>
      </div>

      <p class="step-text">Paso 2 de 3</p>
      <h2>¿Cómo podemos contactarte?</h2>

      <label>Nombre completo *</label>
      <input type="text" name="nombre" placeholder="Tu nombre y apellidos" required="">

      <label>Correo electrónico *</label>
      <input type="email" name="email" placeholder="correo@ejemplo.com" required="">

      <label>Teléfono (opcional)</label>
      <input type="tel" name="telefono" placeholder="+34 600 000 000">

      <div class="form-footer">
        <button type="button" class="back">‹ Anterior</button>
        <button type="button" class="btn next">Siguiente ›</button>
      </div>
    </div>

    <!-- PASO 3 -->
    <div class="form-step" data-step="3">
      <div class="progress">
        <span class="active"></span><span class="active"></span><span class="active"></span>
      </div>

      <p class="step-text">Paso 3 de 3</p>
      <h2>Cuéntanos brevemente tu caso</h2>

      <textarea name="caso" placeholder="Describe tu situación jurídica brevemente. No te preocupes por los detalles técnicos, nuestros abogados te orientarán..." required=""></textarea>

<label class="privacy-check">
  <input type="checkbox" name="privacidad" required>
  <span>Acepto la <a href="https://google.es" target="_blank" rel="noopener">política de privacidad</a>.</span>
</label>

<div class="form-footer">
  <button type="button" class="back">‹ Anterior</button>
  <button type="submit" class="btn">Enviar consulta</button>
</div>

    <div id="formMessage"></div>

  </form>
</div>

<style>
.legal-form-wrapper {
  max-width: 520px;
  margin: 40px auto;
  padding: 0 12px;
  font-family: inherit;
}

.legal-form {
  background: #fff;
  border: 1px solid #dbe3ea;
  border-radius: 14px;
  padding: 28px;
  box-shadow: 0 2px 8px rgba(0,0,0,.04);
  overflow: hidden;
}

.form-step {
  display: none;
}

.form-step.active {
  display: block;
  animation: subtleEnter 180ms ease forwards;
}

.form-step.leaving {
  display: block;
  animation: subtleExit 160ms ease forwards;
}

@keyframes subtleExit {
  from {
    opacity: 1;
    transform: translateX(0);
  }
  to {
    opacity: 0;
    transform: translateX(-8px);
  }
}

@keyframes subtleEnter {
  from {
    opacity: .85;
    transform: translateX(6px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.progress {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
}

.progress span {
  flex: 1;
  height: 4px;
  border-radius: 20px;
  background: #dce3ea;
}

.progress span.active {
  background: #1268c4;
}

.step-text {
  color: #536d89;
  font-size: 14px;
  margin-bottom: 18px;
}

.legal-form h2 {
  font-size: 22px;
  margin-bottom: 22px;
  color: #07111f;
}

.cards-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.option-card {
  border: 2px solid #dce3ea;
  border-radius: 12px;
  padding: 16px;
  cursor: pointer;
  transition: .2s ease;
}

.option-card input {
  display: none;
}

.option-card strong {
  display: block;
  font-size: 16px;
  color: #07111f;
  margin-bottom: 4px;
}

.option-card span {
  font-size: 14px;
  color: #64748b;
}

.option-card:has(input:checked) {
  border-color: #8bbcf0;
  background: #f7fbff;
}

.legal-form label {
  display: block;
  margin: 16px 0 8px;
  font-weight: 500;
  color: #07111f;
}

.legal-form input,
.legal-form textarea {
  width: 100%;
  border: 1px solid #dce3ea;
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 15px;
  box-sizing: border-box;
  outline: none;
}

.legal-form input:focus,
.legal-form textarea:focus {
  border-color: #8bbcf0;
}

.legal-form textarea {
  min-height: 126px;
  resize: vertical;
}

.form-footer {
  border-top: 1px solid #dce3ea;
  margin-top: 28px;
  padding-top: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.btn {
  background: #9fc4e8;
  color: #fff;
  border: none;
  border-radius: 12px;
  padding: 13px 22px;
  font-weight: 700;
  cursor: pointer;
  font-size: 15px;
  transition: .2s ease;
}

.btn.is-active {
  background: #0f66bd;
}

.btn.is-active:hover {
  background: #0d5ba9;
}

.back {
  background: none;
  border: none;
  color: #607ca0;
  font-size: 15px;
  cursor: pointer;
}

#formMessage {
  margin-top: 18px;
  font-weight: 600;
}

.hp-field {
  display: none !important;
}

@media (max-width: 600px) {
  .cards-grid {
    grid-template-columns: 1fr;
  }

  .legal-form {
    padding: 22px;
  }
}


.privacy-check {
  display: flex !important;
  gap: 8px;
  align-items: flex-start;
  margin: 16px 0 0;
  font-size: 12px;
  line-height: 1.4;
  color: #9aa6b2 !important;
  font-weight: 400 !important;
}

.privacy-check input {
  width: auto !important;
  margin-top: 2px;
  accent-color: #0f66bd;
}

.privacy-check span {
  color: #9aa6b2 !important;
}

.privacy-check a {
  color: #9aa6b2 !important;
  text-decoration: underline;
}

</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const form = document.getElementById("legalForm");
  const steps = document.querySelectorAll(".form-step");
  const nextButtons = document.querySelectorAll(".next");
  const backButtons = document.querySelectorAll(".back");
  const message = document.getElementById("formMessage");

  let currentStep = 0;
  let isAnimating = false;

  function validateStepSilent() {
    const currentFields = steps[currentStep].querySelectorAll("input, textarea");

    for (let field of currentFields) {
      if (!field.checkValidity()) return false;
    }

    if (currentStep === 0) {
      return !!form.querySelector('input[name="area"]:checked');
    }

    return true;
  }

  function updateButtonState() {
    const currentButton = steps[currentStep].querySelector(".next, button[type='submit']");
    if (!currentButton) return;

    if (validateStepSilent()) {
      currentButton.classList.add("is-active");
    } else {
      currentButton.classList.remove("is-active");
    }
  }

  function validateStep() {
    const currentFields = steps[currentStep].querySelectorAll("input, textarea");

    for (let field of currentFields) {
      if (!field.checkValidity()) {
        field.reportValidity();
        return false;
      }
    }

    if (currentStep === 0) {
      const selectedArea = form.querySelector('input[name="area"]:checked');
      if (!selectedArea) {
        alert("Selecciona un área para continuar.");
        return false;
      }
    }

    return true;
  }

  function showStep(index) {
    if (isAnimating || index < 0 || index >= steps.length) return;

    isAnimating = true;

    const current = steps[currentStep];
    current.classList.add("leaving");

    setTimeout(() => {
      steps.forEach(step => {
        step.classList.remove("active", "leaving", "entering");
      });

      currentStep = index;
      steps[currentStep].classList.add("active", "entering");

      setTimeout(() => {
        steps[currentStep].classList.remove("entering");
        isAnimating = false;
        updateButtonState();
      }, 180);
    }, 160);
  }

  nextButtons.forEach(button => {
    button.addEventListener("click", () => {
      if (validateStep()) {
        showStep(currentStep + 1);
      }
    });
  });

  backButtons.forEach(button => {
    button.addEventListener("click", () => {
      showStep(currentStep - 1);
    });
  });

  form.addEventListener("input", updateButtonState);
  form.addEventListener("change", updateButtonState);

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    if (!validateStep()) return;

    const data = new FormData(form);

    data.append("action", "send_legal_form");
    data.append("nonce", legalFormAjax.nonce);

    message.style.color = "#536d89";
    message.textContent = "Enviando consulta...";

    fetch(legalFormAjax.ajax_url, {
      method: "POST",
      body: data
    })
    .then(response => response.json())
    .then(result => {
      if (result.success) {
        message.style.color = "#0f66bd";
        message.textContent = result.data;

        form.reset();

        setTimeout(() => {
          showStep(0);
          message.textContent = "";
        }, 2500);

      } else {
        message.style.color = "#bb271a";
        message.textContent = result.data || "Ha ocurrido un error.";
      }
    })
    .catch(() => {
      message.style.color = "#bb271a";
      message.textContent = "Error de conexión. Inténtalo de nuevo.";
    });
  });

  updateButtonState();
});
</script>
